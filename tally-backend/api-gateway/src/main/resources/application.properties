# Spring Boot configuration — tracked in git, placeholder values only.
# For Railway: set each ${VAR_NAME} as an environment variable in the Railway dashboard.
# For local dev the defaults below work as-is (no local override file needed).

spring.application.name=api-gateway

# The gateway owns port 8082 — the SAME port the monolith served, so the
# mobile app's BASE_URL (<hotspot-ip>:8082) keeps working unchanged.
# Railway injects PORT automatically.
server.port=${PORT:8082}

# ---------------------------------------------------------------------------
# Downstream service URLs — env vars on Railway, localhost defaults for dev.
# ---------------------------------------------------------------------------
services.auth-url=${AUTH_SERVICE_URL:http://localhost:8090}
services.expense-url=${EXPENSE_SERVICE_URL:http://localhost:8091}
services.budget-url=${BUDGET_SERVICE_URL:http://localhost:8092}
services.group-url=${GROUP_SERVICE_URL:http://localhost:8093}

# ---------------------------------------------------------------------------
# CORS — centralized here (see CorsConfig). Set ALLOWED_ORIGINS in production.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# The backend services also emit CORS headers (their internal SecurityConfig);
# keep only the gateway's copy on the way out.
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
