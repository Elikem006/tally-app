# Spring Boot configuration — tracked in git, placeholder values only.
# For Railway: set each ${VAR_NAME} as an environment variable in the Railway dashboard.
# For local dev: override values in application-local.properties (gitignored),
#   then run with SPRING_PROFILES_ACTIVE=local.

spring.application.name=auth-service

# Railway injects PORT automatically; 8090 is the local fallback.
# Locally this service sits BEHIND the api-gateway (port 8082) — the mobile
# app must never call this port directly.
server.port=${PORT:8090}

# ---------------------------------------------------------------------------
# Database — this service's own dedicated Neon project. Each Tally
# service now has a separate database (true database-per-service); DB_HOST/
# DB_NAME here point at THIS service's project only, not a shared one.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# validate ONLY — the schema is shared with the other Tally services and is
# never altered from here. Do not change to 'update' or 'create'.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# INCLUDE_ERROR_MESSAGES: 'always' for dev, 'never' for production
server.error.include-message=${INCLUDE_ERROR_MESSAGES:always}

# ---------------------------------------------------------------------------
# JWT — MUST be the same JWT_SECRET across ALL Tally services.
# auth-service issues tokens; the others only validate them.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}

# ---------------------------------------------------------------------------
# CORS — external CORS is centralized at the api-gateway. This service-level
# setting stays permissive because only the gateway reaches this service.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# ---------------------------------------------------------------------------
# Inter-service URL — auth-service's one outbound call: asking group-service
# who shares a group with the caller, to authorize POST /api/auth/users/lookup.
# ---------------------------------------------------------------------------
services.group-url=${GROUP_SERVICE_URL:http://localhost:8093}

# ---------------------------------------------------------------------------
# Outbound email (password-reset OTP). Fully env-driven — swapping SMTP host/
# port/credentials for a new domain/ESP (Mailgun, SendGrid, ...) later is a
# pure env-var change, zero code edits. No real identity/credential is baked
# in as a fallback — the empty/protocol-standard defaults below (same as
# `server.port=${PORT:8090}` elsewhere in this file) only exist so the service
# still BOOTS when mail isn't configured yet; UserService.generatePasswordResetOtp
# already catches a resulting send failure cleanly rather than crashing.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mail.from-address=${MAIL_FROM_ADDRESS:}
mail.from-name=${MAIL_FROM_NAME:Tally}
# Falls back to the from-address when unset — most sending domains don't need
# a separate reply-to until there's a real inbox behind the new domain.
mail.reply-to=${MAIL_REPLY_TO:${MAIL_FROM_ADDRESS:}}

# Include the OTP in the forgot-password API response in addition to emailing
# it. Must stay unset/false once real SMTP is live — the whole point of
# emailing the OTP is that reading the response alone isn't enough. Exists so
# local dev / the live demo aren't blocked if SMTP isn't configured yet.
otp.debug-expose=${OTP_DEBUG_EXPOSE:false}
