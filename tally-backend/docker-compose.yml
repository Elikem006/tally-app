# Tally microservices — one-command local orchestration.
#
#   docker-compose up --build
#
# brings up Postgres (4 databases, one per service — schema pre-loaded from
# database/*-schema.sql via database/init-multi-db.sh), the four backend
# services and the api-gateway. The system is then reachable at
# http://localhost:8082 — same port the mobile app targets. No other steps.
#
# Database-per-service: each service gets its own dedicated local database
# (mirroring the 4 separate Neon projects in production) rather than sharing
# one. Still one Postgres *container* though — 4 separate local containers
# would add real startup/resource overhead with no isolation benefit anyone
# would actually observe locally; the isolation that matters is the one in
# production, which is genuinely separate servers.
#
# Secrets/overrides live in a local .env file (see .env.example) — nothing is
# hardcoded in the Dockerfiles. Defaults below work out of the box for a
# fully local stack (local Postgres, dev JWT secret, MoMo disabled).

x-app-env: &app-env
  DB_USERNAME: tally
  DB_PASSWORD: tally
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-32chars!}
  INCLUDE_ERROR_MESSAGES: always

services:
  tally-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
    volumes:
      - ./database:/schemas:ro
      - ./database/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
      - tally-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 15
    # No host port mapping on purpose. Windows reserves large dynamic port
    # ranges for Hyper-V/WSL2, and binding inside one fails with "an attempt
    # was made to access a socket in a way forbidden by its access
    # permissions" — 5432 and 5433 both hit it, so picking another number is
    # guesswork. Nothing needs it: every service reaches Postgres over the
    # Docker network as tally-db:5432, which host binding plays no part in.
    # Re-add a mapping only to attach an external client like psql or DBeaver.

  auth-service:
    build: ./auth-service
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://tally-db:5432/tally_auth
      GROUP_SERVICE_URL: http://group-service:8093
    depends_on:
      tally-db:
        condition: service_healthy

  expense-service:
    build: ./expense-service
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://tally-db:5432/tally_expense
      BUDGET_SERVICE_URL: http://budget-service:8092
      GROUP_SERVICE_URL: http://group-service:8093
      AUTH_SERVICE_URL: http://auth-service:8090
      MOMO_SUBSCRIPTION_KEY: ${MOMO_SUBSCRIPTION_KEY:-}
      MOMO_API_USER: ${MOMO_API_USER:-}
      MOMO_API_KEY: ${MOMO_API_KEY:-}
      MOMO_DISBURSEMENT_SUBSCRIPTION_KEY: ${MOMO_DISBURSEMENT_SUBSCRIPTION_KEY:-}
      MOMO_DISBURSEMENT_API_USER: ${MOMO_DISBURSEMENT_API_USER:-}
      MOMO_DISBURSEMENT_API_KEY: ${MOMO_DISBURSEMENT_API_KEY:-}
    depends_on:
      tally-db:
        condition: service_healthy

  budget-service:
    build: ./budget-service
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://tally-db:5432/tally_budget
      EXPENSE_SERVICE_URL: http://expense-service:8091
    depends_on:
      tally-db:
        condition: service_healthy

  group-service:
    build: ./group-service
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://tally-db:5432/tally_group
      EXPENSE_SERVICE_URL: http://expense-service:8091
      AUTH_SERVICE_URL: http://auth-service:8090
    depends_on:
      tally-db:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8090
      EXPENSE_SERVICE_URL: http://expense-service:8091
      BUDGET_SERVICE_URL: http://budget-service:8092
      GROUP_SERVICE_URL: http://group-service:8093
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "8082:8082"
    depends_on:
      - auth-service
      - expense-service
      - budget-service
      - group-service

volumes:
  tally-db-data:
